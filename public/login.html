<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — RDO Palmont</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef1f4;color:#18212b;font:16px system-ui;padding:20px}.card{width:min(420px,100%);padding:28px;background:white;border:1px solid #d3dae2;border-radius:14px}img{width:200px;max-width:100%;background:#000}h1{font-size:25px}label{display:block;margin:16px 0 5px}input,button{font:inherit;width:100%;border-radius:7px;padding:12px}input{border:1px solid #b1bdc9}button{border:0;background:#1d4f7c;color:white;margin-top:14px;cursor:pointer}.secondary{background:#e5edf5;color:#1d4f7c}button:disabled{opacity:.5}#message{color:#a03c10;line-height:1.5}</style><script src="backend.js" defer></script><link rel="stylesheet" href="design.css"></head><body><main class="card"><img src="logo-palmont.png" alt="Palmont"><h1 id="title">RDO e Apontamento</h1><form id="form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button id="submit">Entrar</button></form><button id="signup" class="secondary">Criar minha conta</button><button id="recover" class="secondary">Esqueci minha senha</button><p id="message" role="status"></p></main><script>
let mode='login';const $=id=>document.getElementById(id);
document.addEventListener('DOMContentLoaded',()=>{
 $('signup').onclick=()=>{mode=mode==='signup'?'login':'signup';$('title').textContent=mode==='signup'?'Criar minha conta':'RDO e Apontamento';$('submit').textContent=mode==='signup'?'Cadastrar':'Entrar';$('signup').textContent=mode==='signup'?'Voltar para entrar':'Criar minha conta';};
 $('recover').onclick=async()=>{if(!$('email').reportValidity())return;try{await RDO.recover($('email').value.trim());$('message').textContent='Confira seu e-mail para recuperar a senha.';}catch(e){$('message').textContent=e.message;}};
 $('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('message').textContent='Aguarde…';try{await RDO.ready;const email=$('email').value.trim(),password=$('password').value;if(mode==='signup'){await RDO.signup(email,password);$('message').textContent='Cadastro solicitado. Confirme seu e-mail antes de entrar.';}else if(mode==='reset'){await RDO.password(password);sessionStorage.removeItem('rdo.recovery');location.replace('index.html');}else{await RDO.login(email,password);location.replace('index.html');}}catch(e){$('message').textContent=/Invalid login credentials/i.test(e.message)?'E-mail ou senha incorretos.':e.message;}finally{$('submit').disabled=false;$('password').value='';}};
 RDO.ready.then(()=>{if(sessionStorage.getItem('rdo.recovery')){mode='reset';$('title').textContent='Nova senha';$('submit').textContent='Salvar nova senha';$('email').required=false;$('email').hidden=true;$('signup').hidden=true;$('recover').hidden=true;}}).catch(e=>$('message').textContent=e.message);
});
</script></body></html>
