<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico — RDO Palmont</title><link rel="stylesheet" href="design.css"><script src="backend.js" defer></script><script src="history-actions.js" defer></script><script src="historico.js" defer></script><script src="vendor/xlsx.full.min.js" defer></script><script src="relatorio-geral.js" defer></script><style>.history-page{max-width:1100px;margin:auto;padding:24px}.history-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:20px;border:1px solid #304255;border-radius:16px;background:#182330}.history-filters label{display:grid;gap:8px}.history-filters select{width:100%;min-width:0}.history-filters input{width:100%;min-width:0;box-sizing:border-box}.history-page article{padding:20px;margin:14px 0;border:1px solid #304255;border-radius:14px;background:#182330}.history-page strong,.history-page p{overflow-wrap:anywhere}.history-page button{padding:12px 18px;border-radius:9px;cursor:pointer;background:#6aa8dc;color:#07131e;border:0;font:inherit}.history-page a{color:#87c6f5}@media(max-width:600px){.history-filters{grid-template-columns:1fr}.history-page{padding:16px}}</style></head><body class="history-page"><a href="index.html">← Voltar ao RDO</a><h1>Histórico e cópias</h1><section aria-label="Baixar RDOs por período" style="margin:24px 0"><h2>Baixar geral por período</h2><p>Inclui todos os RDOs salvos no banco, mesmo sem Excel gerado anteriormente. O período considera a data do RDO.</p><form id="report-form" class="history-filters"><label>Data inicial do RDO<input id="report-from" type="date" required></label><label>Data final do RDO<input id="report-to" type="date" required></label><label>Equipe<select id="report-team"><option value="">Todas as equipes</option></select></label><label>Turno<select id="report-shift"><option value="">Todos os turnos</option><option value="1">1º turno</option><option value="2">2º turno</option></select></label><button id="report-download" type="submit" disabled>Baixar Excel por período</button></form><p id="report-message" role="status" aria-live="polite">Carregando equipes…</p></section><h2>Cópias de arquivos gerados</h2><section class="history-filters" aria-label="Pesquisar arquivos"><label>Nome do arquivo<input id="search-name" type="search" placeholder="Pesquisar pelo nome"></label><label>Equipe<input id="search-team" type="search" placeholder="Pesquisar equipe"></label><label>Gerado de<input id="date-from" type="date"></label><label>Gerado até<input id="date-to" type="date"></label><label style="grid-column:1/-1">Usuário (e-mail)<input id="search-user" type="search" maxlength="254" placeholder="E-mail ou parte dele"></label><button id="history-search-button" type="button">Pesquisar</button><button id="clear-filters" type="button">Limpar filtros</button></section><p id="message" role="status" aria-live="polite">Carregando…</p><div id="files"></div></body></html>
