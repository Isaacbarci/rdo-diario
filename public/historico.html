<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico — RDO Palmont</title><style>body{font:16px system-ui;margin:30px auto;padding:16px;max-width:850px;background:#eef1f4;color:#18212b}article{background:white;border:1px solid #d3dae2;padding:16px;border-radius:10px;margin:12px 0}button{background:#1d4f7c;color:white;border:0;border-radius:6px;padding:10px;cursor:pointer}p{overflow-wrap:anywhere}a{color:#1d4f7c}</style><script src="backend.js" defer></script><link rel="stylesheet" href="design.css"></head><body class="history-page"><a href="index.html">← Voltar ao RDO</a><h1>Histórico e cópias</h1><p id="message" role="status">Carregando…</p><div id="files"></div><script>document.addEventListener('DOMContentLoaded',async()=>{try{await RDO.ready;const files=await RDO.history();document.getElementById('message').textContent=files.length?files.length+' arquivo(s) da sua conta.':'Você ainda não gerou arquivos.';for(const file of files){const item=document.createElement('article'),name=document.createElement('strong'),info=document.createElement('p'),button=document.createElement('button');name.textContent=file.nome;info.textContent=new Date(file.criado_em).toLocaleString('pt-BR')+' · '+file.autor_email;button.textContent='Baixar cópia';button.onclick=async()=>{button.disabled=true;try{await RDO.historyDownload(file);}catch(e){document.getElementById('message').textContent=e.message;}finally{button.disabled=false;}};item.append(name,info,button);document.getElementById('files').append(item);}}catch(e){document.getElementById('message').textContent=e.message;}});</script></body></html>
