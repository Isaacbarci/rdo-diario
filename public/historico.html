<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico — RDO Palmont</title><link rel="stylesheet" href="design.css"><script src="backend.js" defer></script><script src="historico.js" defer></script><style>.history-page{max-width:1100px;margin:auto;padding:24px}.history-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:20px;border:1px solid #304255;border-radius:16px;background:#182330}.history-filters label{display:grid;gap:8px}.history-filters input{width:100%;min-width:0;box-sizing:border-box}.history-page article{padding:20px;margin:14px 0;border:1px solid #304255;border-radius:14px;background:#182330}.history-page strong,.history-page p{overflow-wrap:anywhere}.history-page button{padding:12px 18px;border-radius:9px;cursor:pointer;background:#6aa8dc;color:#07131e;border:0;font:inherit}.history-page a{color:#87c6f5}@media(max-width:600px){.history-filters{grid-template-columns:1fr}.history-page{padding:16px}}</style></head><body class="history-page"><a href="index.html">← Voltar ao RDO</a><h1>Histórico e cópias</h1><section class="history-filters" aria-label="Pesquisar arquivos"><label>Nome do arquivo<input id="search-name" type="search" placeholder="Pesquisar pelo nome"></label><label>Equipe<input id="search-team" type="search" placeholder="Pesquisar equipe"></label><label>Gerado de<input id="date-from" type="date"></label><label>Gerado até<input id="date-to" type="date"></label><button id="clear-filters" type="button">Limpar filtros</button></section><p id="message" role="status" aria-live="polite">Carregando…</p><div id="files"></div></body></html>
